apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app1
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/MickRamah/public_repo.git
    targetRevision: main
    path: app

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true